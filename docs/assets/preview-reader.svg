<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="readerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12131b"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Browser Frame Wrapper -->
  <rect width="1000" height="580" rx="10" fill="#101117" stroke="#232533" stroke-width="1.5"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1000" height="46" rx="10" fill="#13141d"/>
  <rect x="0" y="45" width="1000" height="1" fill="#222533"/>

  <!-- Brand Mark -->
  <rect x="18" y="11" width="24" height="24" rx="4" fill="#f8fafc"/>
  <text x="24" y="27" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="900" font-size="12">PP</text>
  <text x="50" y="27" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">PDFProof</text>
  <text x="110" y="27" fill="#475569" font-family="ui-monospace, monospace" font-size="10">v1.0</text>

  <!-- Document Filename Tag -->
  <text x="150" y="27" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">|  zero-knowledge-reading-verification.pdf (4p)</text>

  <!-- Navigation Tabs Pill -->
  <rect x="520" y="9" width="310" height="28" rx="6" fill="#1b1d28" stroke="#2b2e40" stroke-width="1"/>
  <text x="536" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Library</text>
  <rect x="585" y="11" width="56" height="24" rx="4" fill="#282a3a"/>
  <text x="597" y="27" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">Reader</text>
  <text x="655" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Analytics</text>
  <text x="715" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Reports</text>
  <text x="770" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Verify</text>

  <!-- Live Ticker in Header -->
  <rect x="850" y="10" width="130" height="26" rx="5" fill="#161822" stroke="#292c3d" stroke-width="1"/>
  <circle cx="863" cy="23" r="3.5" fill="#10b981"/>
  <text x="874" y="27" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">04:12</text>
  <text x="918" y="27" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">/</text>
  <text x="932" y="27" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">p.2</text>

  <!-- Viewer Secondary Minimal Toolbar -->
  <rect x="0" y="46" width="1000" height="38" fill="#12131b"/>
  <rect x="0" y="83" width="1000" height="1" fill="#202230"/>

  <text x="20" y="70" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">&lt; Sidebar &gt;   Page: [ 2 ] / 4    - [115%] +    [Fit Width]   |   Mode: [Continuous]   [Search /]   [⛶ Fullscreen]</text>

  <!-- Main Canvas Area -->
  <g transform="translate(0, 84)">
    <!-- Sidebar Left -->
    <rect x="0" y="0" width="160" height="496" fill="#0f1016" stroke="#1f212d" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PAGES (4)</text>

    <!-- Thumbnail 1 -->
    <rect x="18" y="38" width="124" height="88" rx="4" fill="#ffffff" stroke="#2b2d3d" stroke-width="1"/>
    <circle cx="132" cy="48" r="3.5" fill="#10b981"/>
    <rect x="28" y="52" width="70" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="28" y="60" width="94" height="2" rx="1" fill="#e2e8f0"/>
    <rect x="28" y="66" width="90" height="2" rx="1" fill="#e2e8f0"/>
    <rect x="28" y="72" width="85" height="2" rx="1" fill="#e2e8f0"/>
    <text x="24" y="140" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Page 1</text>
    <text x="110" y="140" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">68s</text>

    <!-- Thumbnail 2 (ACTIVE) -->
    <rect x="16" y="156" width="128" height="92" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="134" cy="166" r="3.5" fill="#10b981"/>
    <rect x="28" y="170" width="60" height="4" rx="1" fill="#0284c7"/>
    <rect x="28" y="178" width="95" height="2" rx="1" fill="#e2e8f0"/>
    <rect x="28" y="184" width="90" height="2" rx="1" fill="#e2e8f0"/>
    <rect x="28" y="190" width="80" height="2" rx="1" fill="#e2e8f0"/>
    <rect x="28" y="196" width="92" height="2" rx="1" fill="#e2e8f0"/>
    <text x="24" y="262" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Page 2 [NOW]</text>
    <text x="110" y="262" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">142s</text>

    <!-- Thumbnail 3 -->
    <rect x="18" y="278" width="124" height="88" rx="4" fill="#ffffff" stroke="#222430" stroke-width="1"/>
    <text x="24" y="380" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Page 3</text>
    <text x="118" y="380" fill="#475569" font-family="ui-monospace, monospace" font-size="10">0s</text>

    <!-- Document Paper Sheet in Reading Area -->
    <rect x="240" y="18" width="560" height="460" rx="4" fill="#ffffff" filter="url(#shadow)"/>

    <!-- Document Header & Text Layer Rendering -->
    <text x="280" y="55" fill="#475569" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">JOURNAL OF PRIVACY-PRESERVING COMPUTING | VOL. 14, NO. 2</text>
    <text x="280" y="85" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">2. MATHEMATICAL FORMULATION &amp; DWELL APPRAISAL</text>
    <text x="280" y="105" fill="#334155" font-family="Charter, Georgia, serif" font-size="11" font-style="italic">Dr. Elena Vance, Department of Applied Cryptography</text>
    <line x1="280" y1="115" x2="760" y2="115" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Text paragraphs mockup -->
    <text x="280" y="136" fill="#334155" font-family="Charter, Georgia, serif" font-size="11">Let D be a PDF document comprising N discrete pages P = {p_1, p_2, ..., p_N}.</text>
    <text x="280" y="154" fill="#334155" font-family="Charter, Georgia, serif" font-size="11">At any discrete timestamp t within a reading session S, the browser viewport defines a visible window V_t.</text>
    <text x="280" y="172" fill="#334155" font-family="Charter, Georgia, serif" font-size="11">For each page p_i, the geometric intersection engine calculates visible intersection ratio α_i(t) ∈ [0, 1].</text>

    <!-- Formula Box Callout -->
    <rect x="280" y="190" width="480" height="54" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="310" y="214" fill="#0284c7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">w_i(t) = α_i(t) / ∑ α_j(t)       [Normalized Weight]</text>
    <text x="310" y="232" fill="#0f172a" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Δt_i   = Δt · w_i(t)            [Zero Double-Counting Dwell Increment]</text>

    <text x="280" y="268" fill="#334155" font-family="Charter, Georgia, serif" font-size="11">This invariant strictly guarantees that total active dwell time accumulated across all pages equals the elapsed</text>
    <text x="280" y="286" fill="#334155" font-family="Charter, Georgia, serif" font-size="11">active session duration. Dwell timers automatically freeze upon window blur, tab switching, or navigation.</text>

    <!-- Watermark / Footer in Canvas -->
    <text x="730" y="465" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">p. 2 of 4</text>
  </g>
</svg>

