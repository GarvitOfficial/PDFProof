<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#14151f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191b26"/>
      <stop offset="100%" stop-color="#12131b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Top Accent Border Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="12" fill="none" stroke="#242633" stroke-width="1.5"/>

  <!-- Category Tag -->
  <g transform="translate(60, 68)">
    <rect width="250" height="26" rx="13" fill="#1b1d2a" stroke="#2e3245" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ZERO-TELEMETRY ATTESTATION</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="155" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">PDFProof</text>
  
  <text x="285" y="155" fill="#64748b" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="500">v1.0.0 • PRODUCTION GRADE</text>

  <!-- Subheadline -->
  <text x="60" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
    Verifiable PDF Reading Analytics, Page Dwell Heatmaps &amp; Tamper-Evident Ed25519 Attestation
  </text>

  <!-- Core Invariant Pills -->
  <g transform="translate(60, 240)">
    <!-- Pill 1: Web Crypto SHA-256 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="40" rx="8" fill="url(#cardGrad)" stroke="#262938" stroke-width="1"/>
      <path d="M16 20 L24 20 M20 16 L20 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="25" fill="#e2e8f0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600">SHA-256 Fingerprint</text>
    </g>

    <!-- Pill 2: Ed25519 Signatures -->
    <g transform="translate(205, 0)">
      <rect width="180" height="40" rx="8" fill="url(#cardGrad)" stroke="#262938" stroke-width="1"/>
      <circle cx="20" cy="20" r="5" fill="none" stroke="#818cf8" stroke-width="2"/>
      <text x="34" y="25" fill="#e2e8f0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600">Ed25519 Signatures</text>
    </g>

    <!-- Pill 3: AES-256-GCM Encryption -->
    <g transform="translate(400, 0)">
      <rect width="180" height="40" rx="8" fill="url(#cardGrad)" stroke="#262938" stroke-width="1"/>
      <rect x="14" y="17" width="12" height="9" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M17 17 V13 C17 11.5 23 11.5 23 13 V17" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <text x="34" y="25" fill="#e2e8f0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600">AES-256-GCM Sealed</text>
    </g>

    <!-- Pill 4: Zero Cloud Telemetry -->
    <g transform="translate(595, 0)">
      <rect width="175" height="40" rx="8" fill="url(#cardGrad)" stroke="#262938" stroke-width="1"/>
      <path d="M16 20 L20 24 L28 16" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="25" fill="#e2e8f0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600">100% Client-Side</text>
    </g>

    <!-- Pill 5: Invariant Conservation -->
    <g transform="translate(785, 0)">
      <rect width="195" height="40" rx="8" fill="url(#cardGrad)" stroke="#262938" stroke-width="1"/>
      <text x="16" y="25" fill="#38bdf8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700">∑</text>
      <text x="34" y="25" fill="#e2e8f0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600">Zero Double-Counting</text>
    </g>
  </g>

  <!-- Interactive State Monitor Indicator Box (Right Side Graphic) -->
  <g transform="translate(860, 50)">
    <rect width="280" height="150" rx="10" fill="#111219" stroke="#252837" stroke-width="1"/>
    
    <text x="20" y="32" fill="#64748b" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1">LIVE TELEMETRY ENGINE</text>
    <circle cx="250" cy="28" r="4" fill="#10b981"/>

    <!-- Metrics Inside Graphic -->
    <text x="20" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">State:</text>
    <text x="65" y="68" fill="#34d399" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700">ACTIVE [Paused On Blur]</text>

    <text x="20" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Dwell Accumulation:</text>
    <text x="155" y="96" fill="#f8fafc" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700">Exact dt · (α_i / W)</text>

    <text x="20" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Verification Hash:</text>
    <text x="140" y="124" fill="#38bdf8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">7d56e6...Verified ✓</text>
  </g>

  <!-- Bottom Quote Bar -->
  <text x="60" y="340" fill="#64748b" font-family="Charter, Georgia, 'Times New Roman', serif" font-style="italic" font-size="14">
    "Engineered with editorial restraint, typographic hierarchy, and mathematical proof of reading engagement."
  </text>
</svg>
