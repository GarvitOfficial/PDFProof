<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <!-- Frame -->
  <rect width="1000" height="520" rx="10" fill="#0d0e14" stroke="#232533" stroke-width="1.5"/>

  <!-- Page Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">CRYPTOGRAPHIC AUDIT SUITE • ZERO-TRUST VERIFICATION</text>
    <text x="0" y="28" fill="#f8fafc" font-family="Charter, Georgia, serif" font-size="22" font-weight="800">Verify Report Authenticity &amp; Non-Repudiation</text>
    <text x="0" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Recalculates invariant canonical digest, audits Ed25519 digital signature, and compares original PDF SHA-256 byte fingerprint.</text>
  </g>

  <!-- Verification Card Main Banner -->
  <g transform="translate(40, 110)">
    <rect width="920" height="125" rx="8" fill="#092219" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Shield Icon Success Badge -->
    <circle cx="50" cy="50" r="24" fill="#064e3b"/>
    <path d="M40 50 L47 57 L62 42" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="90" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Cryptographic Integrity Verified ✓</text>
    <rect x="365" y="30" width="60" height="18" rx="3" fill="#065f46"/>
    <text x="375" y="43" fill="#34d399" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PASS</text>

    <text x="90" y="66" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">
      The canonical payload digest matches the original SHA-256 hash byte-for-byte. The Ed25519 digital signature is valid.
    </text>

    <text x="90" y="86" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">
      No tampering, truncation, or unauthorized data alterations detected across reading dwell records.
    </text>
  </g>

  <!-- 3 Verification Pillars -->
  <g transform="translate(40, 255)">
    <!-- Pillar 1: Digest -->
    <rect x="0" y="0" width="290" height="110" rx="6" fill="#13141e" stroke="#252838" stroke-width="1"/>
    <text x="18" y="26" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">CANONICAL DIGEST (SHA-256)</text>
    <circle cx="265" cy="22" r="5" fill="#10b981"/>
    <text x="18" y="52" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14" font-weight="700">Exact Match ✓</text>
    <text x="18" y="74" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Recalculated: 7d56e6...ae77d3</text>
    <text x="18" y="92" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Declared:     7d56e6...ae77d3</text>

    <!-- Pillar 2: Ed25519 Signature -->
    <rect x="315" y="0" width="290" height="110" rx="6" fill="#13141e" stroke="#252838" stroke-width="1"/>
    <text x="333" y="26" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">DIGITAL SIGNATURE (Ed25519)</text>
    <circle cx="580" cy="22" r="5" fill="#10b981"/>
    <text x="333" y="52" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14" font-weight="700">Mathematically Verified ✓</text>
    <text x="333" y="74" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Algorithm: RFC 8032 Edwards-DSA</text>
    <text x="333" y="92" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Key: bGZ3Tj...8A== (Validated)</text>

    <!-- Pillar 3: Original PDF Byte Comparison -->
    <rect x="630" y="0" width="290" height="110" rx="6" fill="#13141e" stroke="#252838" stroke-width="1"/>
    <text x="648" y="26" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PDF BYTE-STREAM BINDING</text>
    <circle cx="895" cy="22" r="5" fill="#10b981"/>
    <text x="648" y="52" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14" font-weight="700">Identical Binary Fingerprint ✓</text>
    <text x="648" y="74" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">Target: zero-knowledge-...pdf</text>
    <text x="648" y="92" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">SHA-256 matches supplied PDF</text>
  </g>

  <!-- Bottom Key Fingerprint Box -->
  <g transform="translate(40, 385)">
    <rect width="920" height="95" rx="6" fill="#111219" stroke="#232533" stroke-width="1"/>
    <text x="20" y="24" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SIGNER PUBLIC KEY ATTESTATION &amp; AUDIT TRAIL</text>
    
    <text x="20" y="50" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Public Key Fingerprint (SHA-256):</text>
    <text x="270" y="50" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>

    <text x="20" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">
      Institutional Notice: Proves report non-repudiation and integrity against document bytes. Pre-register key fingerprint with course/audit registry for institutional credit.
    </text>
  </g>
</svg>

